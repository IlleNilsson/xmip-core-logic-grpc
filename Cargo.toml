[package]
name = "xmip-core-logic-grpc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-logic-grpc"
description = "gRPC logic technology: a /package.Service/Method path and a length-prefixed message become a named operation with protobuf arguments, and a result or status becomes a frame and grpc-status trailers again, on a stream of an HTTP/2 connection. A xmip-core-logic technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The Logic trait and its shapes live there.
logic = { workspace = true }
stream = { workspace = true }
contract = { workspace = true }
# gRPC's framing and its status codes: net::grpc, the one copy the operate
# plane frames with too. HTTP/2, both halves, for the test that calls a
# method across a loopback connection; the technology itself never sees a
# connection (ADR-0043).
net = { workspace = true }

[dev-dependencies]
xcore = { workspace = true }

[lints]
workspace = true
